/* Pink & black sales cockpit (user-pinned reference). Dark only by choice. Panels 24px, cards 20px, pills. Mona Sans (variable width and weight); the thing you act on is loudest, labels step back. */
:root{
  color-scheme:dark;
  --ground:#060607; --panel:#111113; --card:#19191c; --card-2:#222226; --card-3:#2b2b30;
  --line:#26262b; --line-2:#36363d;
  --fg:#f6f6f7; --fg-2:#c4c4cb; --muted:#9a9aa4;
  --pink:#ff5c9d; --pink-btn:#db2777; --pink-btn-h:#e83d88; --pink-soft:rgba(255,92,157,.14); --pink-line:rgba(255,92,157,.38);
  --k-booking:#ff9466; --k-google:#86adff; --k-stale:#f0be6c; --k-thin:#5fd3c6; --k-builder:#a9b8c8; --k-ads:#7ad98a; --k-nosite:#ff8a8a;
  --k-mail:#86adff; --k-phone:#7ad98a; --k-form:#a9b8c8; --k-link:#86adff; --k-user:#c4c4cb; --k-bulb:#ffd166;
  --s-new:#8c8c96; --s-contacted:#86adff; --s-replied:#5fd3c6; --s-audit:#f0be6c; --s-call:#7ad98a; --s-won:#ff5c9d; --s-lost:#ff8a8a;
  --r-panel:18px; --r-card:14px; --r-in:10px; --r-ctl:10px;
  --t-xs:14px; --t-s:15.5px; --t-m:16px; --t-l:24px; --t-xl:30px; --t-xxl:44px;
  --shadow:0 20px 50px rgba(0,0,0,.45);
  --w-body:420; --w-med:540; --w-strong:660; --w-sub:620;
  --font:"Mona Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --glass:rgba(15,15,18,.56); --glass-strong:rgba(15,15,18,.74); --glass-card:rgba(24,24,28,.62); --row:rgba(28,28,33,.78); --row-h:rgba(40,40,46,.86);
  --rim:linear-gradient(150deg,rgba(255,255,255,.26),rgba(255,255,255,.05) 34%,rgba(255,255,255,0) 60%,rgba(255,92,157,.22));
  --blur:blur(28px) saturate(160%);
  --e-out:cubic-bezier(.16,1,.3,1); --e-in:cubic-bezier(.4,0,1,1); --mv:1;
}
*{box-sizing:border-box}
html,body{height:100%}
html{background:var(--ground)}
body{background:transparent;color:var(--fg);font-family:var(--font);font-size:var(--t-m);font-weight:var(--w-body);line-height:1.5;letter-spacing:.003em;-webkit-font-smoothing:antialiased;touch-action:manipulation;caret-color:var(--pink)}
::selection{background:rgba(255,92,157,.35)}
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:lining-nums}
.fig{font-stretch:118%;font-weight:var(--w-sub);letter-spacing:-.02em}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;z-index:50;background:var(--pink-btn);color:#fff;font-weight:var(--w-strong);padding:10px 14px;border-radius:999px;text-decoration:none}
.skip:focus{top:calc(10px + env(safe-area-inset-top,0px))}
svg.i{width:1.3em;height:1.3em;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)}

/* Living background: Paper Shaders mesh gradient (ShaderGradient look). CSS glow is the fallback and the reduced-motion still. */
#bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;
  background:radial-gradient(55% 45% at 82% 8%,rgba(219,39,119,.30),transparent 70%),radial-gradient(45% 55% at 8% 92%,rgba(143,29,82,.34),transparent 70%),radial-gradient(40% 40% at 45% 55%,rgba(58,11,36,.55),transparent 75%),var(--ground)}
#bg canvas{position:absolute!important;inset:0;width:100%!important;height:100%!important;opacity:0;transition:opacity 1.4s var(--e-out)}
#bg.live canvas{opacity:1}
#bg::after{content:"";position:absolute;inset:0;background:radial-gradient(130% 100% at 50% 40%,transparent 50%,rgba(0,0,0,.45)),rgba(0,0,0,.18)}

/* Liquid glass: live backdrop blur + specular rim (Liquid Glass JS look, without page snapshots) */
.sheet,.pop{-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.side,.top,.panel,.card,.sheet,.col,.pop{position:relative;background:var(--glass);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 30px 70px rgba(0,0,0,.35)}
.card{background:var(--glass-card)}
.sheet,.pop{background:var(--glass-strong)}
.side::after,.top::after,.panel::after,.card::after,.sheet::after,.col::after,.pop::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:var(--rim);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);pointer-events:none}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.sheet,.pop{background:rgba(17,17,19,.96)}}

/* Shell */
.app{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;min-height:100%;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{border-radius:var(--r-panel);padding:26px 18px 20px;display:flex;flex-direction:column;gap:26px;position:sticky;top:16px;height:calc(100vh - 32px);height:calc(100dvh - 32px)}
.brand{display:flex;align-items:center;gap:12px;padding:0 10px 22px;border-bottom:1px solid var(--line)}
.brand .mark{position:relative;width:44px;height:44px;border-radius:14px;background:radial-gradient(120% 120% at 30% 20%,#ff5c9d,#db2777 45%,#5c0f33);color:#fff;display:grid;place-items:center;font-weight:var(--w-strong);font-size:20px;flex:none;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 24px rgba(219,39,119,.35)}
.brand .mark canvas{position:absolute!important;inset:2px;width:calc(100% - 4px)!important;height:calc(100% - 4px)!important;opacity:0;transition:opacity .8s var(--e-out)}
.brand .mark.live canvas{opacity:1}
.brand .mark.live .mark-n{opacity:0}
.mark-n{transition:opacity .6s}
.brand b{display:block;font-size:20px;font-weight:var(--w-med);letter-spacing:-.01em;line-height:1.2}
.brand small{display:block;color:var(--muted);font-size:var(--t-xs)}
.nav{display:flex;flex-direction:column;gap:4px;margin:0;padding:0;list-style:none}
.nav a{position:relative;z-index:0;display:flex;align-items:center;gap:12px;min-height:46px;padding:0 14px;border-radius:999px;color:var(--fg-2);text-decoration:none;font-weight:var(--w-med);transition:background-color .15s,color .15s}
.nav a:hover{background:var(--card);color:var(--fg)}
.nav a[aria-current="page"]{background:transparent;color:var(--fg)}
.nav a[aria-current="page"]::before{content:"";position:absolute;inset:0;border-radius:999px;background:var(--card-2);z-index:-1}
.nav a[aria-current="page"] svg{color:var(--pink)}
.nav .count{margin-left:auto;font-size:var(--t-xs);color:var(--muted);font-weight:var(--w-med)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:14px}
.side-foot .link{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 14px;border-radius:999px;border:0;background:transparent;color:var(--fg-2);font-weight:var(--w-med);text-align:left}
.side-foot .link:hover{background:var(--card);color:var(--fg)}
.side-foot p{margin:0;padding:0 14px;font-size:var(--t-xs);color:var(--muted);line-height:1.5}
.side-foot p a{color:inherit}

.main{min-width:0;display:flex;flex-direction:column;gap:16px}
.top{border-radius:var(--r-panel);padding:14px 16px;display:flex;align-items:center;gap:12px}
.menu{display:none;width:44px;height:44px;border-radius:999px;border:0;background:var(--card);place-items:center;flex:none;color:var(--fg)}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 12px;min-height:46px;width:min(440px,100%);color:var(--muted);transition:border-color .15s}
.search:focus-within{border-color:var(--pink-line)}
.search input{flex:1;min-width:0;border:0;outline:none;background:transparent;color:var(--fg);min-height:44px}
.search input::placeholder{color:var(--muted)}
.kbd{display:inline-flex;gap:4px}
.kbd span{font-size:12.5px;color:var(--muted);background:var(--card-3);border-radius:6px;padding:1px 6px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line-2);background:transparent;color:var(--fg);font-weight:var(--w-med);white-space:nowrap;transition:background-color .15s,border-color .15s,transform .1s}
a.btn{text-decoration:none}
.btn:hover{background:var(--card-2)}
.btn:active{transform:scale(.98)}
.btn.pink{background:var(--pink-btn);border-color:var(--pink-btn);color:#fff}
.btn.pink:hover{background:var(--pink-btn-h);border-color:var(--pink-btn-h)}
.btn.white{background:#fff;border-color:#fff;color:#0d0d0f}
.btn.white:hover{background:#ececef}
.btn.sm{min-height:36px;padding:0 14px;font-size:var(--t-s)}
.btn.icon{width:44px;padding:0}
.btn.sm.icon{width:36px}

.content{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{border-radius:var(--r-panel);padding:24px}

/* Dashboard */
.hero{display:flex;align-items:center;gap:24px;flex-wrap:wrap;padding:26px 28px}
.date{width:104px;height:104px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font-size:40px;font-weight:var(--w-med);flex:none}
.hero .day{font-size:var(--t-xl);font-weight:var(--w-med);line-height:1.2}
.hero .sep{width:1px;align-self:stretch;background:var(--line-2);margin:10px 4px}
.hero .greet{margin-left:auto;text-align:right}
.hero .greet b{display:block;font-size:var(--t-xl);font-weight:var(--w-med);line-height:1.2}
.hero .greet span{display:block;font-size:var(--t-xl);font-weight:var(--w-med);color:var(--muted);line-height:1.25}
.hero .greet em{font-style:normal}
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.cards2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{border-radius:var(--r-card);padding:26px;display:flex;flex-direction:column;gap:18px;min-width:0}
.card-h{display:flex;align-items:flex-start;gap:12px}
.card-h h2{margin:0;font-size:var(--t-xl);font-weight:var(--w-med);letter-spacing:-.01em;line-height:1.2}
.card-h .go{margin-left:auto;width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--fg);display:grid;place-items:center;flex:none}
.card-h .go:hover{background:var(--card-3)}
.who{display:flex;gap:14px;align-items:center;min-width:0}
.mono{width:64px;height:64px;border-radius:16px;background:var(--pink-soft);color:var(--pink);display:grid;place-items:center;font-size:26px;font-weight:var(--w-strong);flex:none}
.who b{display:block;font-size:18px;font-weight:var(--w-med);line-height:1.3;overflow-wrap:anywhere}
.who div>span:not(.stag):not(.fitline){display:block;font-size:var(--t-s);color:var(--muted)}
.who .fitline{display:block;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px 20px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:var(--t-s);font-weight:var(--w-med);color:var(--fg-2);line-height:1.35}
.chip svg.i{width:17px;height:17px;color:var(--ib)}
.next-actions{display:flex;gap:8px;margin-top:auto}
.next-actions .btn.pink{flex:1;min-height:52px;font-size:16px}
.hbars{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.hbar{display:grid;grid-template-columns:128px minmax(0,1fr) 28px;align-items:center;gap:10px;font-size:var(--t-s)}
.hbar .nm{display:flex;align-items:center;gap:7px;color:var(--fg-2);white-space:nowrap}
.hbar .nm svg.i{width:15px;height:15px;color:var(--c)}
.hbar .tr{height:10px;border-radius:999px;background:var(--card-3);overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:999px;background:var(--c)}
.hbar .n{text-align:right;color:var(--fg);font-weight:var(--w-med)}
.cap-line{margin:auto 0 0;font-size:var(--t-s);color:var(--muted)}
.cap-line b{color:var(--fg-2);font-weight:var(--w-med)}
/* All-done state */
.donebox{display:flex;align-items:center;gap:16px}
.donebox b{display:block;font-size:var(--t-xl);font-weight:var(--w-med);line-height:1.2}
.donebox span{color:var(--fg-2)}
.dcheck{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--pink-btn);color:#fff;flex:none;box-shadow:0 10px 30px rgba(219,39,119,.45)}
.dcheck svg.i{width:26px;height:26px}
.follow.due{box-shadow:inset 0 0 0 1px var(--pink-line),0 30px 70px rgba(0,0,0,.35)}
/* Hero week numbers */
.wk{display:flex;gap:36px;margin:0}
.wk div{display:flex;flex-direction:column-reverse}
.wk dt{font-size:var(--t-s);color:var(--muted)}
.wk dd{margin:0;font-size:var(--t-xl);font-weight:var(--w-med);line-height:1.2}
/* Today's goal */
.card-h .dd.range{margin-left:auto;flex:none}
.gnum{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.gnum .big{font-size:64px;font-weight:var(--w-med);line-height:1;letter-spacing:-.02em}
.gnum .of{font-size:18px;color:var(--fg-2)}
.ticks{display:grid;grid-template-columns:repeat(var(--g),minmax(0,1fr));gap:6px}
.ticks i{height:40px;border-radius:999px;background:var(--card-3);transform-origin:50% 100%}
.ticks i.on{background:var(--pink)}
.hbar.zero .nm{color:var(--muted)}
.hbar.zero .n{color:var(--muted)}
/* Follow-ups due */
.follow .card-h{align-items:center;flex-wrap:wrap}
.badge{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 10px;border-radius:999px;background:var(--pink-btn);color:#fff;font-weight:var(--w-med);font-size:var(--t-m)}
.fu-note{margin:0 0 0 auto;font-size:var(--t-s);color:var(--muted)}
.frows{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.frow{display:flex;align-items:center;gap:14px;padding:10px 10px 10px 12px;border-radius:var(--r-in);background:var(--row);cursor:pointer;transition:background-color .15s}
.frow:hover{background:var(--card-3)}
.frow .fw{flex:1;min-width:0}
.frow .name{all:unset;cursor:pointer;display:block;font-weight:var(--w-med);overflow-wrap:anywhere}
.frow .name:focus-visible{outline:2px solid var(--pink);outline-offset:2px;border-radius:4px}
.frow .fw span{font-size:var(--t-s);color:var(--muted)}
.frow .fa{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.fu-empty{display:flex;gap:14px;align-items:center;padding:16px 18px;border-radius:var(--r-in);background:var(--row);color:var(--muted);font-size:var(--t-s)}
.fu-empty svg.i{width:24px;height:24px;color:var(--s-replied);flex:none}
.fu-empty b{color:var(--fg);font-weight:var(--w-med)}
.pinklink{display:inline-flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--pink);font-weight:var(--w-med);text-align:left;padding:0}
.pinklink .dotb{width:40px;height:40px;border-radius:50%;background:var(--pink-btn);color:#fff;display:grid;place-items:center}
.pinklink:hover{color:#ff86b6}

/* List pages: same header panel as the dashboard greeting */
.vhead{display:flex;align-items:center;gap:20px 24px;flex-wrap:wrap;padding:22px 24px}
.vhead .ccirc{width:88px;height:88px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font-size:30px;font-weight:var(--w-med);flex:none}
.vhead .vt{min-width:0}
.vhead h1{margin:0;font-size:var(--t-xl);font-weight:var(--w-med);letter-spacing:-.01em;line-height:1.2}
.vhead .vt p{margin:4px 0 0;color:var(--muted)}
.vhead .vf{flex:1 1 640px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;min-width:0}
.vhead .seg{background:var(--card)}
.seg{display:inline-flex;background:var(--panel);border-radius:999px;padding:4px;gap:2px}
.seg button{position:relative;z-index:0;display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 16px;border:0;border-radius:999px;background:transparent;color:var(--fg-2);font-weight:var(--w-med);transition:color .15s}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{color:#0d0d0f}
.seg button[aria-pressed="true"]::before{content:"";position:absolute;inset:0;border-radius:999px;background:#fff;z-index:-1;transform-origin:0 0}
.seg .d{width:8px;height:8px;border-radius:50%;background:var(--fd)}
.seg b{font-weight:var(--w-strong)}
.tb-right{display:flex;gap:8px;flex-wrap:wrap}
.fit-strong{--fd:var(--pink)} .fit-good{--fd:#ffb3cf} .fit-maybe{--fd:var(--muted)}

/* Custom dropdown */
.dd{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 16px;border:1px solid var(--line-2);border-radius:999px;background:transparent;color:var(--fg);font-weight:var(--w-med);text-align:left;transition:border-color .15s,background-color .15s}
.dd:hover{background:var(--card-2)}
.dd[aria-expanded="true"],.dd:focus-visible{outline:none;border-color:var(--pink)}
.dd .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd .chev{width:14px;height:14px;color:var(--fg-2);transition:transform .15s}
.dd[aria-expanded="true"] .chev{transform:rotate(180deg)}
.dd.filter{min-width:160px}
.dd.status{width:100%;min-height:38px;font-size:var(--t-s);padding:0 10px 0 12px;border-color:transparent;background:color-mix(in srgb,var(--sc) 14%,transparent);color:var(--sc)}
.dd.status:hover{border-color:color-mix(in srgb,var(--sc) 40%,transparent)}
.dd.range{min-height:36px;font-size:var(--t-s);padding:0 12px 0 14px}
.pop{position:fixed;z-index:40;border-radius:16px;box-shadow:var(--shadow);padding:6px;max-height:min(360px,60vh);overflow-y:auto;overscroll-behavior:contain;animation:popin .14s cubic-bezier(.2,.8,.2,1)}
.pop:focus,.pop:focus-visible{outline:none}
#content:focus,#content:focus-visible{outline:none}
@keyframes popin{from{opacity:0;transform:translateY(calc(-6px*var(--mv))) scale(calc(1 - .03*var(--mv)))}to{opacity:1;transform:none}}
.pop .opt{display:flex;align-items:center;gap:10px;width:100%;min-height:42px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:var(--fg);font-weight:var(--w-med);text-align:left}
.pop .opt:hover,.pop .opt.active{background:var(--card-3)}
.pop .ol{flex:1;min-width:0}
.pop .cnt{color:var(--muted);font-size:var(--t-xs);min-width:24px;text-align:right}
.pop .tick{width:16px;height:16px;color:var(--pink);visibility:hidden}
.pop .opt[aria-selected="true"] .tick{visibility:visible}
.pop .sep{height:1px;background:var(--line-2);margin:5px 8px}
.pop .opt svg.si{color:var(--sc)}
.st-new{--sc:var(--s-new)}.st-contacted{--sc:var(--s-contacted)}.st-replied{--sc:var(--s-replied)}.st-audit_sent{--sc:var(--s-audit)}.st-call_booked{--sc:var(--s-call)}.st-won{--sc:var(--s-won)}.st-lost{--sc:var(--s-lost)}

/* Icon tiles: colour = meaning */
.ib{--ib:var(--fg-2);display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;flex:none;color:var(--ib);background:color-mix(in srgb,var(--ib) 15%,transparent)}
.ib svg.i{width:16px;height:16px}
.ib.md{width:36px;height:36px;border-radius:11px}.ib.md svg.i{width:20px;height:20px}
.k-booking{--ib:var(--k-booking)}.k-google{--ib:var(--k-google)}.k-stale{--ib:var(--k-stale)}.k-thin{--ib:var(--k-thin)}.k-builder{--ib:var(--k-builder)}.k-ads{--ib:var(--k-ads)}.k-nosite{--ib:var(--k-nosite)}.k-other{--ib:var(--fg-2)}
.k-mail{--ib:var(--k-mail)}.k-phone{--ib:var(--k-phone)}.k-form{--ib:var(--k-form)}.k-link{--ib:var(--k-link)}.k-user{--ib:var(--k-user)}.k-bulb{--ib:var(--k-bulb)}

/* Lead list: one panel per fit group, each lead a card like the dashboard's */
.gpanel{display:flex;flex-direction:column;gap:18px}
.ghead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:2px 4px 0}
.ghead h2{margin:0;font-size:var(--t-xl);font-weight:var(--w-med);letter-spacing:-.01em;line-height:1.2;display:flex;align-items:center;gap:12px}
.ghead h2 .d{width:10px;height:10px;border-radius:50%;background:var(--fd);flex:none}
.ghead .gn{display:inline-grid;place-items:center;min-width:34px;height:30px;padding:0 11px;border-radius:999px;background:var(--card-2);color:var(--fg-2);font-size:var(--t-s);font-weight:var(--w-med);line-height:1}
.ghead p{margin:0 0 0 auto;color:var(--muted);font-size:var(--t-s)}
.rows{display:flex;flex-direction:column;gap:8px}
.rows.call{--reach:200px}
.lrow{display:grid;grid-template-columns:minmax(240px,1.1fr) minmax(300px,1.9fr) var(--reach,96px) 40px;grid-template-areas:"who what reach go";gap:20px;align-items:center;padding:14px 14px 14px 14px;background:var(--row);border-radius:var(--r-card);cursor:pointer;transition:background-color .15s}
.lrow:hover{background:var(--row-h)}
.lrow .who{grid-area:who}.lrow .what{grid-area:what}.lrow .reach{grid-area:reach}.lrow .go{grid-area:go}
.mono.sm{width:48px;height:48px;border-radius:14px;font-size:20px}
.mono.xs{width:34px;height:34px;border-radius:10px;font-size:15px}
.mono.plain{background:var(--card-3);color:var(--fg-2)}
.who .name{all:unset;cursor:pointer;display:block;font-size:16px;font-weight:var(--w-med);line-height:1.35;overflow-wrap:anywhere}
.who .name:focus-visible{outline:2px solid var(--pink);outline-offset:3px;border-radius:4px}
.lrow.worked .who .name{color:var(--fg-2)}
.what{display:flex;flex-direction:column;gap:8px;min-width:0}
.chip.more{color:var(--muted);font-weight:400}
.chip.warn{--ib:var(--k-stale);color:var(--k-stale)}
.pitchline{margin:0;font-size:var(--t-s);color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitchline span{color:var(--muted)}
.reach{display:flex;gap:8px;align-items:center;justify-content:flex-end}
.reach .none{font-size:var(--t-xs);color:var(--muted);white-space:nowrap}
.rbtn{--ib:var(--fg-2);width:40px;height:40px;border-radius:50%;border:1px solid var(--line-2);background:transparent;display:grid;place-items:center;flex:none;color:var(--ib);text-decoration:none;transition:background-color .15s,border-color .15s}
.rbtn:hover{background:var(--card-3);border-color:var(--card-3)}
.rpill{--ib:var(--k-phone);display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px 0 12px;border-radius:999px;border:1px solid var(--line-2);background:transparent;color:var(--fg);font-weight:var(--w-med);font-size:var(--t-s);white-space:nowrap;transition:background-color .15s,border-color .15s}
.rpill svg.i{color:var(--ib)}
.rpill:hover{background:var(--card-3);border-color:var(--card-3)}
.stag{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:var(--t-s);font-weight:var(--w-med);color:var(--sc)}
.stag svg.i{width:16px;height:16px}
.stag.pop{animation:pop .28s var(--e-out)}
.lrow .go{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--fg);display:grid;place-items:center}
.lrow:hover .go{background:var(--card-3)}
.copy{border:0;background:var(--card-2);border-radius:10px;width:32px;height:32px;display:grid;place-items:center;flex:none;color:var(--fg-2);margin-left:auto;transition:background-color .15s,color .15s}
.copy:hover{background:var(--card-3);color:var(--fg)}
.copy svg.i{width:15px;height:15px}
.fitpill{display:inline-flex;align-items:center;gap:8px;font-size:var(--t-s);font-weight:var(--w-med);color:var(--fd)}
.fitpill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.fitpill.fit-strong{color:var(--pink)}
.fitpill.fit-good{color:#ffb3cf}
.fitpill.fit-maybe{color:var(--fg-2)}
.more-btn{align-self:center;margin-top:4px}
.empty{padding:56px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-weight:var(--w-med);font-size:18px;margin-bottom:4px}

/* Pipeline */
.board-wrap{overflow-x:auto;padding-bottom:8px}
.board-wrap.more-right{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 56px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 56px),transparent)}
.board{display:grid;grid-template-columns:repeat(7,minmax(250px,1fr));gap:12px;min-width:min-content}
.col{border-radius:var(--r-panel);padding:14px;display:flex;flex-direction:column;gap:12px;align-self:start;transition:box-shadow .15s}
.col.drop{box-shadow:inset 0 0 0 2px var(--pink)}
.col h3{margin:0;padding:8px 8px 6px;font-size:17px;font-weight:var(--w-med);display:flex;align-items:center;gap:12px;white-space:nowrap;color:var(--fg)}
.col h3 .ib{--ib:var(--sc);width:36px;height:36px;border-radius:50%}
.col h3 .ib svg.i{width:19px;height:19px}
.col h3 .cl{min-width:0;overflow:hidden;text-overflow:ellipsis}
.col h3 .num{margin-left:auto;color:var(--muted);font-weight:var(--w-med)}
.col-list{display:flex;flex-direction:column;gap:8px;max-height:68vh;overflow-y:auto;overscroll-behavior:contain}
.bcard{background:var(--row);border-radius:var(--r-in);padding:12px;display:flex;gap:12px;align-items:center;cursor:pointer;transition:background-color .15s,transform .15s}
.bcard:hover{background:var(--card-2);transform:translateY(-2px)}
.bcard[draggable="true"]{cursor:grab}
.bcard>div{min-width:0}
.bcard .name{all:unset;cursor:pointer;display:block;font-weight:var(--w-med);line-height:1.35;overflow-wrap:anywhere}
.bcard .name:focus-visible{outline:2px solid var(--pink);outline-offset:2px;border-radius:4px}
.bcard .sub{font-size:var(--t-xs);color:var(--muted);line-height:1.4;margin-top:2px}
.empty-col{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:var(--t-s);color:var(--muted);text-align:center;padding:26px 10px;border-radius:var(--r-in);background:var(--row)}

/* Lead panel */
.scrim{position:fixed;inset:0;background:rgba(4,4,6,.42);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:20;animation:fade .18s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{position:fixed;top:12px;right:12px;bottom:12px;width:min(580px,calc(100% - 24px));border-radius:var(--r-panel);z-index:21;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;animation:slide .32s var(--e-out)}
@keyframes slide{from{transform:translateX(calc(40px*var(--mv)));opacity:0}to{transform:none;opacity:1}}
.sheet-ghost{position:absolute;inset:0;display:flex;flex-direction:column;pointer-events:none}
.s-head{padding:24px 24px 18px;display:flex;flex-direction:column;gap:16px;border-bottom:1px solid var(--line)}
.s-top{display:flex;gap:14px;align-items:flex-start}
.s-top h2:focus{outline:none}
.s-top h2{margin:0 0 6px;font-size:var(--t-xl);font-weight:var(--w-med);letter-spacing:-.01em;line-height:1.2;overflow-wrap:anywhere}
.s-top p{margin:0;color:var(--muted);display:flex;gap:6px 12px;align-items:center;flex-wrap:wrap;font-size:var(--t-s)}
.s-top p .left{color:var(--fg-2)}
.close{margin-left:auto;width:44px;height:44px;border-radius:50%;border:0;background:var(--card-2);display:grid;place-items:center;flex:none;color:var(--fg)}
.close:hover{background:var(--card-3)}
.s-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.s-actions .btn{min-height:48px;text-decoration:none}
.s-actions .btn.pink{flex:1 1 200px}
.s-actions .dd.status{flex:1 1 180px;width:auto;min-height:48px;font-size:var(--t-m)}
.s-actions .btn.next{min-height:48px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:rgba(255,255,255,.04);border-radius:999px;padding:4px}
.step{display:flex;align-items:center;justify-content:center;gap:8px;min-height:40px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-weight:var(--w-med);transition:background-color .2s,color .2s}
.step:hover{color:var(--fg)}
.step .sn{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;border:1px solid var(--line-2);color:var(--fg-2)}
.step .sn svg.i{width:13px;height:13px}
.step.on{background:rgba(255,255,255,.1);color:var(--fg)}
.step.on .sn{background:var(--pink-btn);border-color:var(--pink-btn);color:#fff}
.step.done .sn{background:rgba(255,92,157,.16);border-color:transparent;color:var(--pink)}
.s-foot{padding:14px 24px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:rgba(10,10,12,.35)}
.s-foot .btn{min-height:48px;text-decoration:none}
.s-foot .btn.pink{flex:1 1 220px}
.s-foot .dd.status{flex:1 1 200px;width:auto;min-height:48px;font-size:var(--t-m)}
.btn.ghost{border-color:transparent;color:var(--fg-2)}
.btn.ghost:hover{color:var(--fg);background:rgba(255,255,255,.06)}
.sh:focus{outline:none}
.step-hint{margin:0 0 12px;color:var(--fg-2);font-size:var(--t-s);line-height:1.55}
.st-row{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.st-row .kl{font-size:var(--t-xs);color:var(--muted)}
.s-body{flex:1;padding:22px 24px 34px;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:22px}
.s-sec h3{margin:0 0 12px;font-size:var(--t-s);font-weight:var(--w-med);color:var(--muted)}
.pitchbox{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:var(--r-in);padding:16px}
.pitchbox b{display:block;font-size:18px;font-weight:var(--w-med)}
.pitchbox span{font-size:var(--t-s);color:var(--muted)}
.caution{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:var(--r-in);padding:12px 14px;color:var(--k-stale);font-size:var(--t-s)}
.dlist{display:flex;flex-direction:column;gap:18px;margin:0;padding:0;list-style:none}
.dlist li{display:flex;gap:14px;align-items:flex-start}
.dlist li>div{min-width:0;padding-top:1px}
.dlist b{display:block;color:var(--fg);font-size:var(--t-m);font-weight:var(--w-med);line-height:1.35}
.dlist p{margin:3px 0 0;color:var(--fg-2);font-size:var(--t-s);line-height:1.55;max-width:60ch}
.dlist li>div>p:only-child{margin:0;color:var(--fg);font-size:var(--t-m)}
.kv{display:grid;grid-template-columns:36px minmax(0,1fr);gap:16px 14px;align-items:center}
.kv div{display:flex;gap:4px 10px;align-items:center;flex-wrap:wrap;min-width:0;overflow-wrap:anywhere;font-size:var(--t-m);color:var(--fg)}
.kv .kl{width:100%;font-size:var(--t-xs);color:var(--muted);line-height:1.3}
.kv .miss{color:var(--fg-2)}
.kv .tag{font-size:var(--t-s);color:var(--k-stale)}
.kv .tag.ok{color:var(--k-phone)}
.kv a{color:var(--fg);text-underline-offset:3px;text-decoration-color:var(--pink-line)}
.kv .copy{margin-left:0}
details.script{background:var(--card);border-radius:var(--r-in)}
details.script summary{cursor:pointer;padding:14px 16px;font-weight:var(--w-med);list-style:none;display:flex;align-items:center;gap:10px}
details.script summary::-webkit-details-marker{display:none}
details.script summary::after{content:"Show";margin-left:auto;color:var(--muted);font-size:var(--t-s)}
details.script[open] summary::after{content:"Hide"}
details.script .txt{white-space:pre-wrap;padding:0 16px 14px;line-height:1.65;color:var(--fg-2);overflow-wrap:anywhere;font-size:var(--t-s)}
details.script .row{padding:0 16px 16px}
details.script .subj{display:flex;align-items:center;gap:12px;margin:0 16px 12px;padding:10px 10px 10px 14px;border-radius:12px;background:var(--card-2)}
details.script .subj span{flex:1;min-width:0;color:var(--fg);font-size:var(--t-s);overflow-wrap:anywhere}
details.script .subj small{display:block;font-size:var(--t-xs);color:var(--muted)}
details.script .howto{margin:0 16px 12px;font-size:var(--t-s);color:var(--fg-2);line-height:1.5}
textarea{width:100%;min-height:96px;border:1px solid var(--line-2);border-radius:var(--r-in);padding:12px 14px;background:var(--card);color:var(--fg);resize:vertical}
textarea:focus{outline:none;border-color:var(--pink-line)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.note{font-size:var(--t-s);color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#0d0d0f;padding:8px 8px 8px 18px;border-radius:999px;font-weight:var(--w-med);z-index:30;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;min-height:48px}
.toast button{border:0;background:#0d0d0f;color:#fff;border-radius:999px;min-height:34px;padding:0 14px;font-weight:var(--w-med);display:inline-flex;align-items:center;gap:6px}
.toast button[hidden]{display:none}
.toast button svg.i{width:15px;height:15px}

/* Motion. Feedback 100-160ms at the point of touch; state changes 200-300ms and only the changed thing moves;
   changes of place 300-360ms with a direction that means something; data animates from the last value you saw.
   Arrivals ease out, exits are shorter. --mv scales every distance (0 under reduced motion: fades stay, travel goes). */
@keyframes rise{from{opacity:0;transform:translateY(calc(14px*var(--mv)))}}
@keyframes rowin{from{opacity:0;transform:translateY(calc(10px*var(--mv)))}}
@keyframes pop{from{opacity:0;transform:scale(calc(1 - .14*var(--mv)))}}
@keyframes land{0%{transform:scale(calc(1 - .07*var(--mv)));box-shadow:inset 0 0 0 2px var(--pink)}45%{transform:none;box-shadow:inset 0 0 0 2px var(--pink)}100%{box-shadow:inset 0 0 0 2px transparent}}
.content.enter>*{animation:rise .38s var(--e-out) backwards}
.content.enter>:nth-child(2){animation-delay:.05s}
.content.enter>:nth-child(3){animation-delay:.1s}
.content.enter>:nth-child(n+4){animation-delay:.15s}
.content.enter>.board-wrap{animation:none}
.content.enter .board .col{animation:rise .38s var(--e-out) backwards;animation-delay:calc(.05s + var(--i,0)*.04s)}
.lrow.in{animation:rowin .32s var(--e-out) backwards;animation-delay:calc(var(--i,0)*.03s)}
.dd.status.pop{animation:pop .28s var(--e-out)}
.bcard.landed{animation:land .8s var(--e-out)}
.bcard.dragging{opacity:.35}
.go svg,.btn svg,.pinklink .dotb svg{transition:transform .18s var(--e-out)}
.lrow:hover .go svg,.card-h .go:hover svg{transform:translate(calc(2px*var(--mv)),calc(-2px*var(--mv)))}
#next-top:hover svg,#go-next:hover svg,.next-actions .btn.pink:hover svg,.pinklink:hover .dotb svg{transform:translateX(calc(3px*var(--mv)))}
.rbtn,.rpill,.copy,.close,.go{transition:background-color .15s,border-color .15s,color .15s,transform .1s}
.rbtn:active,.rpill:active,.copy:active,.close:active,.go:active{transform:scale(.93)}
.done svg.i{animation:pop .26s var(--e-out)}
.rbtn.done,.copy.done,.rpill.done svg.i,.side-foot .link.done svg.i,.btn.done:not(.pink) svg.i{color:var(--pink)}

/* ===== Liquid glass, site-wide =====
   Three layers on every surface: a translucent tint, a top sheen, and a specular rim (bright top-left, pink bottom-right).
   Big surfaces blur what's behind them; rows and controls inside them are lighter clear glass. */
:root{
  --glass:rgba(20,12,20,.40); --glass-strong:rgba(16,10,16,.62); --glass-card:rgba(24,14,22,.36); --muted:#b4b0bc; --fg-2:#d6d3dc;
  --sheen:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.035) 38%,rgba(255,255,255,0) 70%);
  --rim:linear-gradient(145deg,rgba(255,255,255,.55),rgba(255,255,255,.10) 28%,rgba(255,255,255,.02) 55%,rgba(255,140,190,.30) 85%,rgba(255,92,157,.55));
  --blur:blur(22px) saturate(185%) brightness(1.06);
  --clear:rgba(255,255,255,.055); --clear-h:rgba(255,255,255,.10);
  --edge:inset 0 1px 0 rgba(255,255,255,.18),inset 0 0 0 1px rgba(255,255,255,.07),inset 0 -1px 0 rgba(255,92,157,.10);
}
body{text-shadow:0 1px 2px rgba(0,0,0,.28)}
.btn.pink,.btn.white,.seg button[aria-pressed="true"],.toast{text-shadow:none}
.side,.top,.panel,.card,.sheet,.col,.pop{background:var(--sheen),var(--glass);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 30px 80px rgba(0,0,0,.40)}
.card{background:var(--sheen),var(--glass-card)}
.sheet,.pop{background:var(--sheen),var(--glass-strong)}
/* clear glass: rows, inner boxes */
.lrow,.bcard,.frow,.fu-empty,.empty-col,.pitchbox,details.script,.subj,.caution{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.025));box-shadow:var(--edge)}
.lrow:hover,.bcard:hover,.frow:hover{background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.05))}
details.script .subj{background:rgba(255,255,255,.06)}
/* glass controls */
.btn,.dd,.rbtn,.rpill,.close,.copy,.menu{background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border-color:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.btn:hover,.dd:hover,.rbtn:hover,.rpill:hover,.close:hover,.copy:hover{background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.08));border-color:rgba(255,255,255,.22)}
.close,.copy{border:1px solid rgba(255,255,255,.14)}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
.btn.pink{background:linear-gradient(180deg,#f2559a,#db2777 55%,#c21f68);border-color:rgba(255,170,205,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -2px 6px rgba(120,10,60,.35),0 10px 28px rgba(219,39,119,.38)}
.btn.pink:hover{background:linear-gradient(180deg,#ff6aa8,#e83d88 55%,#cf2a74);border-color:rgba(255,190,215,.6)}
.btn.white{background:linear-gradient(180deg,#ffffff,#ece7ec);border-color:#fff;box-shadow:inset 0 -2px 4px rgba(0,0,0,.06),0 10px 26px rgba(0,0,0,.25)}
.dd.status{background:linear-gradient(180deg,color-mix(in srgb,var(--sc) 22%,rgba(255,255,255,.06)),color-mix(in srgb,var(--sc) 10%,transparent));border-color:color-mix(in srgb,var(--sc) 30%,rgba(255,255,255,.1))}
.search{background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border-color:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.16)}
.seg,.steps,.vhead .seg{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.025));box-shadow:var(--edge)}
.seg button[aria-pressed="true"]::before{background:linear-gradient(180deg,#fff,#eee8ef);box-shadow:inset 0 -2px 4px rgba(0,0,0,.08),0 6px 16px rgba(0,0,0,.25)}
.step.on{background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.08));box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.nav a[aria-current="page"]::before{background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05));box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 0 0 1px rgba(255,255,255,.07)}
.nav a:hover{background:rgba(255,255,255,.06)}
textarea{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.14)}
.kbd span{background:rgba(255,255,255,.1)}
.date,.vhead .ccirc{background:radial-gradient(80% 80% at 30% 20%,rgba(255,255,255,.16),rgba(255,255,255,.03) 60%);border-color:rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 12px 30px rgba(0,0,0,.3)}
.mono{background:linear-gradient(160deg,rgba(255,92,157,.30),rgba(255,92,157,.10));box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 0 0 1px rgba(255,92,157,.25)}
.mono.plain{background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.04));box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 0 0 1px rgba(255,255,255,.08)}
.ib{box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.ticks i{background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
.ticks i.on{background:linear-gradient(180deg,#ff7ab3,#e83d88);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 16px rgba(219,39,119,.35)}
.hbar .tr{background:rgba(255,255,255,.08);box-shadow:inset 0 1px 1px rgba(0,0,0,.25)}
.badge,.ghead .gn{box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.ghead .gn{background:rgba(255,255,255,.1)}
.toast{background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(240,232,238,.92));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.s-foot{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(0,0,0,.18))}
.s-head{border-bottom-color:rgba(255,255,255,.08)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.sheet,.pop{background:rgba(24,16,22,.96)}}

/* ===== Type and focus =====
   Mona Sans, one variable family. Roles: figure (wide 118%, 620, tabular) for counts; subject (620-660) for the
   lead or page you act on; label (16px, 560, muted) for card and section names so they never outshout content;
   body 15px/420; meta 14px muted. Primary action and Next up lead; everything else supports. */
h1,h2,h3{text-wrap:balance}
p{text-wrap:pretty}
::selection{background:rgba(255,92,157,.35);color:#fff}
.brand b{font-size:19px;font-weight:var(--w-strong);font-stretch:110%;letter-spacing:-.015em}
.brand .mark{font-stretch:115%}
.nav a{font-weight:var(--w-med)}
.nav a[aria-current="page"]{font-weight:var(--w-sub)}
.btn{font-weight:var(--w-med);letter-spacing:.005em}
.btn.pink{font-weight:var(--w-sub)}
/* hero: a quiet status line; the one emphasis is how much is waiting */
.hero{gap:22px;padding:20px 26px}
.date{width:76px;height:76px;font-size:28px;font-stretch:118%;font-weight:var(--w-sub);letter-spacing:-.02em}
.hero .day{font-size:18px;font-weight:var(--w-med);color:var(--fg-2);line-height:1.3;max-width:9ch}
.hero .sep{margin:6px 4px}
.wk{gap:30px}
.wk dt{font-size:14.5px}
.wk dd{font-size:24px;font-stretch:118%;font-weight:var(--w-sub);letter-spacing:-.02em;line-height:1.15}
.hero .greet b{font-size:16px;font-weight:var(--w-med);color:var(--muted);line-height:1.4}
.hero .greet span{font-size:26px;font-weight:var(--w-sub);color:var(--fg);letter-spacing:-.015em;line-height:1.2}
.hero .greet em{color:var(--pink);font-stretch:118%}
/* cards: label small, content large; Next up gets the wider column */
.cards3{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr) minmax(0,1fr)}
.card-h h2{font-size:17.5px;font-weight:var(--w-med);color:var(--fg-2);letter-spacing:0;line-height:1.4}
.card-h{align-items:center;min-height:40px}
.next .who b,.cards3>.card:first-child .who b{font-size:28px;font-weight:var(--w-sub);letter-spacing:-.02em;line-height:1.15}
.who b{font-size:19px;font-weight:var(--w-sub);letter-spacing:-.01em}
.who div>span:not(.stag):not(.fitline){font-size:15.5px}
.chip{font-size:15.5px}
.gnum .big{font-size:76px;font-stretch:118%;font-weight:var(--w-sub);letter-spacing:-.035em}
.gnum .of{font-size:17.5px;color:var(--muted)}
.hbar .n{font-weight:var(--w-sub)}
.hbar.zero{opacity:.45}
.cap-line b{font-weight:var(--w-sub);color:var(--fg)}
.donebox b{font-size:26px;font-weight:var(--w-sub);letter-spacing:-.015em}
.follow .card-h h2{font-size:17.5px}
.badge{font-weight:var(--w-sub);font-stretch:112%}
.frow .name{font-size:17.5px;font-weight:var(--w-sub)}
/* list pages: page title leads, group names support, row names are the subject */
.vhead .ccirc{width:72px;height:72px;font-size:24px;font-stretch:118%;font-weight:var(--w-sub);letter-spacing:-.02em}
.vhead h1{font-size:30px;font-weight:var(--w-strong);letter-spacing:-.02em;line-height:1.15}
.ghead h2{font-size:21px;font-weight:var(--w-sub);letter-spacing:-.01em}
.ghead .gn{font-weight:var(--w-sub);font-stretch:112%}
.who .name{font-size:18px;font-weight:var(--w-sub);letter-spacing:-.005em}
.pitchline{color:var(--muted)}
.col h3{font-size:17.5px;font-weight:var(--w-sub)}
.bcard b,.bcard .nm{font-weight:var(--w-sub)}
/* lead panel: the business name is the subject; section headings are quiet labels */
.s-top h2{font-size:30px;font-weight:var(--w-strong);letter-spacing:-.02em;line-height:1.15}
.s-sec h3{font-size:14.5px;font-weight:var(--w-med);color:var(--muted);letter-spacing:.01em}
.pitchbox b{font-size:20px;font-weight:var(--w-sub);letter-spacing:-.01em}
.dlist b{font-weight:var(--w-sub)}
.step{font-weight:var(--w-med)}
.step.on{font-weight:var(--w-sub)}
.empty b{font-size:19px;font-weight:var(--w-sub)}

/* ===== Controls: shaped, not pills =====
   One control radius (10px), flat fills, no glow. Pink is a solid fill that means "the next action", used once per view.
   Numbers stand as type, not inside circles. Meters are thin and square-ended. */
.btn,.dd,.search,.menu,.rpill,.side-foot .link,.nav a,.nav a[aria-current="page"]::before,.skip{border-radius:var(--r-ctl)}
.btn,.dd,.rpill,.menu{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);box-shadow:none}
.btn:hover,.dd:hover,.rpill:hover,.menu:hover{background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.2)}
.btn:active{transform:translateY(1px)}
.btn.pink{background:var(--pink-btn);border-color:transparent;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 1px 2px rgba(0,0,0,.35)}
.btn.pink:hover{background:var(--pink-btn-h);border-color:transparent}
.btn.white{background:#f6f4f6;border-color:transparent;color:#0d0d0f;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.btn.white:hover{background:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:rgba(255,255,255,.07)}
.next-actions .btn.pink{min-height:48px;font-size:15.5px}
.dd.status{border-radius:var(--r-ctl);box-shadow:none}
.search{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);box-shadow:none;flex:0 1 440px;width:auto;min-width:0}
/* icon buttons: square with soft corners, quiet until hovered */
.rbtn,.close,.copy{border-radius:var(--r-ctl);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);box-shadow:none}
.rbtn:hover,.close:hover,.copy:hover{background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.2)}
.card-h .go,.lrow .go{border-radius:var(--r-ctl);background:transparent;color:var(--muted)}
.card-h .go:hover,.lrow:hover .go{background:rgba(255,255,255,.08);color:var(--fg)}
.col h3 .ib{border-radius:var(--r-ctl)}
/* segmented controls */
.seg,.steps{border-radius:12px;padding:3px;background:rgba(0,0,0,.22);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.seg button,.step{border-radius:9px}
.seg button[aria-pressed="true"]::before{border-radius:9px;background:#f6f4f6;box-shadow:0 1px 2px rgba(0,0,0,.35)}
.step.on{background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
/* counts and meters */
.badge{border-radius:8px;min-width:30px;height:28px;padding:0 9px;font-size:14px;box-shadow:none}
.ghead .gn{border-radius:7px;height:26px;min-width:30px;padding:0 9px;background:rgba(255,255,255,.08);box-shadow:none}
.ticks{gap:4px}
.ticks i{height:12px;border-radius:3px;background:rgba(255,255,255,.09);box-shadow:none}
.ticks i.on{background:var(--pink);box-shadow:none}
.hbar .tr{height:6px;border-radius:3px;box-shadow:none}
.hbar .tr i{border-radius:3px}
/* numbers as type, no frames */
.date,.vhead .ccirc{width:auto;height:auto;border:0;border-radius:0;background:none;box-shadow:none;line-height:1;display:block}
.date{font-size:40px}
.vhead .ccirc{font-size:40px;color:var(--pink)}
/* tiles */
.mono{border-radius:12px;box-shadow:inset 0 0 0 1px rgba(255,92,157,.25)}
.mono.plain{box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.mono.sm{border-radius:10px}.mono.xs{border-radius:8px}
.lrow,.bcard,.frow{border-radius:12px}
.rbtn{width:44px;height:44px}.lrow .go,.card-h .go{width:44px;height:44px}
.toast{border-radius:12px}.toast button{border-radius:8px}
/* one pink per view: the top-bar shortcut stays neutral so the in-page primary leads */
#next-top{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:var(--fg);box-shadow:none}
#next-top:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.22)}
#next-top svg{color:var(--pink)}

/* ===== Icons: Iconoir, one weight, one tone =====
   Line icons at 1.75 stroke on a 24 grid, sized from the text they sit beside (1.2em), coloured like that text.
   Colour on an icon only when it carries meaning: status (stage colour) and the active nav item. No tinted rainbow tiles. */
.chip svg.i{width:1.3em;height:1.3em;color:var(--muted)}
.chip{gap:9px}
.ib,.col h3 .ib{--ib:var(--fg-2);color:var(--fg-2);background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.ib svg.i{width:20px;height:20px}
.ib.md{width:42px;height:42px}
.ib.md svg.i{width:23px;height:23px}
.col h3 .ib{width:34px;height:34px;color:var(--sc)}
.col h3 .ib svg.i{width:20px;height:20px}
.rpill svg.i{color:var(--fg-2)}
.stag svg.i{width:1.15em;height:1.15em}
.hbar{grid-template-columns:132px minmax(0,1fr) 30px}
.hbar .nm{gap:0}
.btn svg.i{width:21px;height:21px}
.btn.sm svg.i{width:19px;height:19px}
.btn.pink svg.i{stroke-width:2}
.next-actions .btn.pink{gap:10px}
.rbtn svg.i,.close svg.i{width:22px;height:22px}
.copy svg.i{width:19px;height:19px}
.card-h .go svg.i,.lrow .go svg.i{width:22px;height:22px}
.nav a svg.i{width:22px;height:22px;color:var(--muted)}
.nav a:hover svg.i{color:var(--fg-2)}
.nav a[aria-current="page"] svg.i{color:var(--pink)}
.side-foot .link svg.i{width:22px;height:22px;color:var(--muted)}
.search svg.i{width:21px;height:21px;color:var(--muted)}
.dd svg.i{width:19px;height:19px}
.fu-empty svg.i{width:24px;height:24px;stroke-width:1.75}
.dcheck svg.i{width:26px;height:26px;stroke-width:2.25}
.step .sn svg.i{width:13px;height:13px;stroke-width:2.5}
.toast button svg.i{width:16px;height:16px}
.empty-col svg.i{width:24px;height:24px;color:var(--muted)}

/* ===== Logo (Nur&Lead storefront + cursor, 18 Nov 2026) =====
   The user's own mark, redrawn as vector in logo.svg and inlined by assemble.py. No tile behind it: it stands on the glass. */
.brand .mark.logo{width:50px;height:auto;background:none;border-radius:0;box-shadow:none;overflow:visible;display:block;flex:none}
.brand .mark.logo svg{display:block;width:100%;height:auto}

  .hero{padding:20px;gap:16px}.date{font-size:30px}.hero .sep{display:none}.hero .day{font-size:16px;max-width:none}.hero .greet span,.donebox b{font-size:21px}.dcheck{width:42px;height:42px}
  .card{padding:20px}.card-h h2{font-size:15px}.gnum .big{font-size:56px}.cards3>.card:first-child .who b{font-size:22px}.wk{gap:22px;width:100%}.wk dd{font-size:20px}.frow{flex-wrap:wrap}.frow .fa{width:100%;justify-content:flex-start}.fu-note{margin-left:0;width:100%}

  .ghead h2{font-size:18px}.ghead p{margin-left:0;width:100%}
  .panel.gpanel{padding:14px}
  .lrow{grid-template-columns:minmax(0,1fr) 40px;grid-template-areas:"who go" "what what" "reach reach";gap:12px}
  .lrow .reach{justify-content:flex-start}
  .sheet{top:0;right:0;bottom:0;width:100%;border-radius:0}
}
@media (prefers-reduced-motion:reduce){:root{--mv:0}.bcard:hover,.btn:active{transform:none}.side{transition:none}}

<script>

const dayKey=d=>`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;

  const d=new Date();if(!days.has(dayKey(d)))d.setDate(d.getDate()-1);let n=0;while(days.has(dayKey(d))){n++;d.setDate(d.getDate()-1)}return n}

function probKind(t){t=(t||"").toLowerCase();return /\bbook/.test(t)?"booking":t.includes("updated")||t.includes("nothing new")?"stale":t.includes("tiny")||t.includes("whole site")?"thin":t.includes("builder")?"builder":/\bads\b/.test(t)?"ads":t.includes("google")?"google":t.includes("no website")?"nosite":"other"}
const KIND_ICON={booking:"cal",stale:"clock",thin:"file",builder:"tool",google:"google",ads:"ads",nosite:"globe",other:"dot"};
const probTile=(p,size="")=>tile(KIND_ICON[probKind(p)],probKind(p),size);
function safeUrl(u){try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:""}catch{return ""}}
function fmtDate(s){const d=new Date(s);return s&&!isNaN(d)?df.format(d):""}
let toastT, undoFn=null;
function toast(m,undo){const t=$("#toast");$("#toast-msg").textContent=m;undoFn=undo||null;$("#toast-undo").hidden=!undo;t.getAnimations().forEach(a=>a.cancel());t.hidden=false;
  t.animate([{opacity:0,transform:`translate(-50%,${RM()?0:16}px)`},{opacity:1,transform:"translate(-50%,0)"}],{duration:260,easing:EOUT});
  clearTimeout(toastT);toastT=setTimeout(hideToast,undo?6000:2400)}
function hideToast(){const t=$("#toast");undoFn=null;if(t.hidden)return;
  t.animate([{opacity:1,transform:"translate(-50%,0)"},{opacity:0,transform:`translate(-50%,${RM()?0:10}px)`}],{duration:170,easing:EIN}).onfinish=()=>{t.hidden=true}}
/* The button you pressed confirms: its icon turns into a tick for a moment */
function flashDone(b){if(!b||!document.contains(b)||b.classList.contains("done"))return;const u=b.querySelector("use");if(!u)return;
  const h=u.getAttribute("href");u.setAttribute("href","#i-check");b.classList.add("done");setTimeout(()=>{u.setAttribute("href",h);b.classList.remove("done")},1300)}
function tween(el,a,b,suffix=""){if(!el||a===b)return;const t0=performance.now(),d=650;
  (function f(t){const k=Math.min(1,Math.max(0,(t-t0)/d)),e=1-Math.pow(1-k,4);el.textContent=nf.format(Math.round(a+(b-a)*e))+suffix;if(k<1&&document.contains(el))requestAnimationFrame(f)})(t0)}
/* Dashboard numbers move from the values you last saw (zero on first load) to the current ones */
function animateDash(){
  if(view!=="dashboard"||!dashNow||!$("#content .hero"))return;
  const from=dashSeen||{bars:{},counts:{}}, to=dashNow; dashSeen=to; if(RM())return;
  const t0=from.counts.today||0; // newly filled goal ticks pop in one after another
  document.querySelectorAll(".ticks i.on").forEach((el,i)=>{if(i>=t0)el.animate([{transform:"scaleY(.3)",opacity:0},{transform:"none",opacity:1}],{duration:420,delay:150+(i-t0)*70,easing:EOUT,fill:"backwards"})});
  document.querySelectorAll("[data-bar]").forEach(el=>{const a=from.bars[el.dataset.bar]||0,b=to.bars[el.dataset.bar]||0;
    if(b>a)el.animate([{clipPath:`inset(0 ${((1-a/b)*100).toFixed(1)}% 0 0 round 999px)`},{clipPath:"inset(0 0 0 0 round 999px)"}],{duration:700,easing:EOUT})});
  document.querySelectorAll("[data-count]").forEach(el=>tween(el,from.counts[el.dataset.count]||0,to.counts[el.dataset.count]||0));
}
async function copy(text,label,btn){
  try{await navigator.clipboard.writeText(text);toast(label+" copied");flashDone(btn)}
  catch{const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy")}catch{}ta.remove();if(ok)flashDone(btn);toast(ok?label+" copied":"Couldn't copy. Select the text instead")}
}

/* Data helpers */
const bySc=(a,b)=>(b.score||0)-(a.score||0)||(!!b.email)-(!!a.email);
const inView=l=>{const s=VIEWS[view].seg;return !s||l.segment===s};
function filtered(useFit=true){
  const q=$("#q").value.trim().toLowerCase();
  return leads.filter(l=>inView(l)&&(!useFit||!fit||fitOf(l)===fit)&&(!tradeF||l.trade===tradeF)&&(!areaF||l.area===areaF)
    &&(!q||[l.name,l.city,l.contactName,l.email,l.domain].join(" ").toLowerCase().includes(q))).sort(bySc);
}
function queue(){ // leads still to contact, in working order for the current page
  const base=(view==="leads"||view==="no-website")?filtered():leads.slice().sort(bySc);
  return base.filter(l=>st(l)==="new"&&(l.email||l.phone||safeUrl(l.contactForm)));
}
function nextLead(afterId){
  const qu=queue(); if(!qu.length)return null;
  const i=qu.findIndex(l=>l.id===afterId);
  return i<0?qu[0]:(qu[i+1]||qu.find(l=>l.id!==afterId)||null);
}

function openSheet(id){

    ghost.animate([{opacity:1,transform:"none"},{opacity:0,transform:"translateX(-40px)"}],{duration:210,easing:EIN,fill:"forwards"}).onfinish=()=>ghost.remove();
    [...d.children].forEach(c=>{if(c!==ghost)c.animate([{opacity:0,transform:"translateX(48px)"},{opacity:1,transform:"none"}],{duration:360,easing:EOUT})});

function closeSheet(){

        b=sc.animate([{opacity:1},{opacity:0}],{duration:190,easing:"linear",fill:"forwards"});

async function setStage(id,stage,opts={}){
  const l=leads.find(x=>x.id===id); if(!l||st(l)===stage)return false;
  const prev=st(l), nowIso=new Date().toISOString(), patch={status:stage,statusChangedAt:nowIso};
  if(prev==="new")patch.contactedAt=nowIso; else if(stage==="new")patch.contactedAt=null;
  Object.assign(l,patch); changedId=id; render(); changedId=null;
  const undo=opts.silent?null:()=>setStage(id,prev,{silent:true}).then(ok=>ok&&toast(`${l.name}: back to ${STAGE[prev]}`));
  if(prev==="new"&&stage!=="new"&&!opts.silent)maybeCelebrate();
  if(localMode){if(saveLocal(id,patch)){if(!opts.silent)toast(`${l.name}: ${STAGE[stage]}`,undo);return true}toast("Couldn't save in this browser");return false}
  if(!db||!canWrite){l.status=prev;render();toast("You can view these leads but not change them");return false}
  try{await db.collection("leads").doc(id).update(patch);if(!opts.silent)toast(`${l.name}: ${STAGE[stage]}`,undo);return true}
  catch(e){l.status=prev;render();if(e&&e.code==="invalid_argument")canWrite=false;toast("Couldn't save the status. Check your connection and try again");return false}
}

    if(t.dataset.copy){const l=leads.find(x=>x.id===t.dataset.id);if(!l)return;const k=t.dataset.copy;
      if(k==="draft")return copy(emailDraft(l),"Email",t);if(k==="form")return copy(formDraft(l),"Message",t);if(k==="subject")return copy(formSubject(l),"Subject",t);if(k==="followup")return copy(followUpDraft(l),"Follow-up email",t);if(k==="script")return copy(callScript(l),"Phone script",t);return copy(l[k],k==="email"?"Email address":"Phone number",t)}
    return;
  }
  if(e.target.closest("a"))return;
  const row=e.target.closest("[data-row]");
  if(row&&!String(getSelection()||"").trim())openSheet(row.dataset.row);
});
pop.addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();ddActive=(ddActive+(e.key==="ArrowDown"?1:-1)+ddOpts.length)%ddOpts.length;ddRender()}
  else if(e.key==="Home"||e.key==="End"){e.preventDefault();ddActive=e.key==="Home"?0:ddOpts.length-1;ddRender()}
  else if(e.key==="Enter"||e.key===" "){e.preventDefault();ddPick(ddActive)}
  else if(e.key==="Escape"){e.preventDefault();e.stopPropagation();ddClose()}
  else if(e.key==="Tab")ddClose();
  else if(e.key.length===1){const k=e.key.toLowerCase(),n=ddOpts.length;for(let j=1;j<=n;j++){const i=(ddActive+j)%n;if(ddOpts[i].label.toLowerCase().startsWith(k)){ddActive=i;ddRender();break}}}
});
document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();$("#q").focus();$("#q").select();return}
  const b=e.target.closest&&e.target.closest("button[data-dd]");
  if(b&&(e.key==="ArrowDown"||e.key==="ArrowUp")){e.preventDefault();ddOpen(b);return}
  if(e.key==="Escape"){if(!$("#sheet").hidden)closeSheet();else $("#side").classList.remove("open")}
  if(e.key==="Tab"&&!$("#sheet").hidden){const f=[...$("#sheet").querySelectorAll("button:not([disabled]),a[href],textarea:not([disabled]),summary")];if(!f.length)return;const a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
});
window.addEventListener("resize",()=>ddClose(false));
document.addEventListener("scroll",e=>{if(ddBtn&&!(e.target instanceof Node&&pop.contains(e.target)))ddClose(false)},true);
let dragId=null;
document.addEventListener("dragstart",e=>{const c=e.target.closest&&e.target.closest(".bcard");if(!c)return;dragId=c.dataset.card;try{e.dataTransfer.setData("text/plain",dragId)}catch{}setTimeout(()=>c.classList.add("dragging"))});
document.addEventListener("dragover",e=>{const c=e.target.closest&&e.target.closest(".col");if(!c||!dragId)return;e.preventDefault();document.querySelectorAll(".col.drop").forEach(x=>x!==c&&x.classList.remove("drop"));c.classList.add("drop")});
document.addEventListener("drop",e=>{const c=e.target.closest&&e.target.closest(".col");if(!c||!dragId)return;e.preventDefault();c.classList.remove("drop");const id=dragId;dragId=null;setStage(id,c.dataset.stage)});
document.addEventListener("dragend",()=>{dragId=null;document.querySelectorAll(".col.drop").forEach(x=>x.classList.remove("drop"));document.querySelectorAll(".bcard.dragging").forEach(x=>x.classList.remove("dragging"))});

/* Boot */
if(/Mac|iPhone|iPad/.test(navigator.platform||""))document.querySelectorAll(".kbd span:first-child").forEach(s=>s.textContent="⌘");
setView(location.hash.slice(1)||(()=>{try{return localStorage.getItem("lh-view3")}catch{return null}})()||"dashboard",true);
(async()=>{
  db=window.claude?await window.claude.use("db"):null;
  if(!db){
    try{const r=await fetch("leads.json",{cache:"no-store"});if(!r.ok)throw 0;const data=await r.json(),ed=localEdits();
      leads=(data.leads||[]).map(l=>({...l,...(ed[l.id]||{})}));localMode=true;
    }
    catch{}
    loaded=true;render();return}
  try{const u=await window.claude.use("user");if(u&&await u.can("data.write")===false)canWrite=false}catch{}
  let first=true;
  db.collection("leads").limit(1000).onSnapshot(snap=>{
    leads=snap.docs.map(d=>({id:d.id,...d.data()}));loaded=true;
    render();
  },err=>{loaded=true;render();toast(`Couldn't load your leads (${err&&err.code||"error"}). Reload to try again.`)});
  setTimeout(()=>{if(!loaded){$("#content").innerHTML=`<section class="panel"><div class="empty"><b>Your leads are taking a while to load</b>Check your connection. The page fills in once they arrive.</div></section>`}},10000);
})();
</script>
<script type="module">
/* Effects layer. Loads after the app; if a CDN is unreachable the app keeps working with the CSS fallback. */
const RMQ=matchMedia("(prefers-reduced-motion: reduce)");
const PAPER="https://cdn.jsdelivr.net/npm/@paper-design/shaders@0.0.82/+esm";
const THREE="https://cdn.jsdelivr.net/npm/three@0.170.0/+esm";
const sizing=(P,o={})=>{const s={...P.defaultObjectSizing,...o};return{u_fit:P.ShaderFitOptions[s.fit],u_scale:s.scale,u_rotation:s.rotation,u_originX:s.originX,u_originY:s.originY,u_offsetX:s.offsetX,u_offsetY:s.offsetY,u_worldWidth:s.worldWidth,u_worldHeight:s.worldHeight}};
/* One slow ticker for every shader: the motion is slow, so ~15 frames a second looks the same as 60 and costs a quarter.
   It stops when the tab is hidden, while the lead panel covers the page, and under reduced motion. */
const TICK=(()=>{const fns=[];let t=0,last=performance.now(),id=null;
  const idle=()=>document.hidden||RMQ.matches||!document.getElementById("sheet")?.hidden;
  const step=()=>{const now=performance.now();if(!idle()){t+=Math.min(now-last,200);fns.forEach(f=>f(t))}last=now};
  const start=()=>{if(id===null)id=setInterval(step,66)};
  start();document.addEventListener("visibilitychange",()=>{last=performance.now()});
  return{add(f){fns.push(f);f(t)}}})();
(async()=>{
  let P; try{P=await import(PAPER)}catch(e){console.info("Lead Hub: effects library unavailable, using still background");return}
  // 1. Living background: slow pink-and-black mesh gradient
  try{
    const bg=document.getElementById("bg"), colors=["#07050a","#6b1440","#0c0710","#d52c78","#2b0b23","#ff6aa8","#09060b"];
    const m=new P.ShaderMount(bg,P.meshGradientFragmentShader,{u_colors:colors.map(P.getShaderColorFromString),u_colorsCount:colors.length,u_distortion:.9,u_swirl:.45,u_grainMixer:0,u_grainOverlay:.05,...sizing(P,{fit:"cover"})},undefined,0,18000,1,960*540);
    TICK.add(t=>m.setFrame(18000+t*.16));
    requestAnimationFrame(()=>bg.classList.add("live"));
  }catch(e){console.info("Lead Hub: background effect off",e)}
})();
// 3. Daily-goal celebration: a short burst of 3D shapes (three.js), loaded only when it plays
window.lhCelebrate=async(origin)=>{
  if(RMQ.matches)return;
  let T; try{T=await import(THREE)}catch{return}
  const W=innerWidth,H=innerHeight,r=new T.WebGLRenderer({alpha:true,antialias:true});
  r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(W,H);
  Object.assign(r.domElement.style,{position:"fixed",inset:"0",pointerEvents:"none",zIndex:"60"});
  r.domElement.setAttribute("aria-hidden","true");document.body.appendChild(r.domElement);
  const sc=new T.Scene(),cam=new T.PerspectiveCamera(50,W/H,.1,100);cam.position.z=14;
  sc.add(new T.AmbientLight(0xffffff,1.3));const dl=new T.DirectionalLight(0xffffff,2.4);dl.position.set(3,5,8);sc.add(dl);
  const hh=2*Math.tan(cam.fov*Math.PI/360)*cam.position.z,ww=hh*W/H,ox=(origin.x/W-.5)*ww,oy=-(origin.y/H-.5)*hh;
  const geos=[new T.TorusGeometry(.2,.08,12,28),new T.IcosahedronGeometry(.2),new T.SphereGeometry(.16,16,16)];
  const mats=[0xff5c9d,0xdb2777,0xffffff,0xffb3cf].map(c=>new T.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:.45,metalness:.15,roughness:.3,transparent:true}));
  const parts=[];for(let i=0;i<84;i++){const m=new T.Mesh(geos[i%3],mats[i%4]);m.position.set(ox,oy,0);const a=Math.random()*Math.PI*2,sp=3+Math.random()*7;
    parts.push({m,v:new T.Vector3(Math.cos(a)*sp,Math.abs(Math.sin(a))*sp*.9+4,(Math.random()-.5)*5),w:new T.Vector3(Math.random()*7,Math.random()*7,Math.random()*7)});sc.add(m)}
  const t0=performance.now();let last=t0;
  (function f(now){const dt=Math.min(.033,(now-last)/1000);last=now;const t=(now-t0)/1000;
    for(const p of parts){p.v.y-=9*dt;p.m.position.addScaledVector(p.v,dt);p.m.rotation.x+=p.w.x*dt;p.m.rotation.y+=p.w.y*dt}
    const o=Math.max(0,1-Math.max(0,t-1.5)/.9);mats.forEach(m=>m.opacity=o);r.render(sc,cam);
    if(t<2.5&&!document.hidden)requestAnimationFrame(f);else{geos.forEach(g=>g.dispose());mats.forEach(m=>m.dispose());r.dispose();r.domElement.remove()}})(t0);
};
</script>
